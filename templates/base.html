<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ config.SITE_TITLE }}</title>
  <meta name="description" content="{{ config.SITE_DESCRIPTION }}">
  
  <!-- Open Graph / LinkedIn Meta -->
  <meta property="og:title" content="{{ config.SITE_TITLE }}">
  <meta property="og:description" content="{{ config.SITE_DESCRIPTION }}">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="{{ config.SITE_URL }}">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/syntax.css') }}">
  
  <!-- Early theme check to avoid FOUC (Flash of Unstyled Content) -->
  <script>
    (function() {
      const stored = localStorage.getItem('user-theme-preference');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body id="top">
  <!-- Header & Navigation -->
  <header class="site-header no-print">
    <div class="container nav-container">
      <a href="#top" class="site-logo">
        <span class="dot"></span>
        <span>{{ config.AUTHOR_NAME }}</span>
      </a>

      <nav style="display: flex; align-items: center; gap: 1.25rem;">
        <ul class="nav-links">
          {% for item in config.NAV_ITEMS %}
          <li>
            <a href="{{ item.url }}">{{ item.title }}</a>
          </li>
          {% endfor %}
        </ul>

        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <a href="{{ url_for('static', filename='Mike_Hilton_Resume.pdf') }}" class="btn-resume-header" target="_blank" rel="noopener">
            <span>Resume (PDF)</span>
            <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </a>

          <!-- Dark/Light Theme Toggle -->
          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light and dark mode">
            <!-- Sun Icon (shown in dark mode) -->
            <svg id="sun-icon" style="display: none;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <!-- Moon Icon (shown in light mode) -->
            <svg id="moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="site-footer no-print">
    <div class="container footer-content">
      <div>
        &copy; {{ current_year }} {{ config.AUTHOR_NAME }}. Built with Flask &amp; Frozen-Flask.
      </div>
      <div class="footer-links">
        <a href="mailto:{{ resume.PROFILE.email }}">Email</a>
        <a href="{{ resume.PROFILE.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ url_for('static', filename='Mike_Hilton_Resume.pdf') }}" target="_blank" rel="noopener">Resume PDF</a>
        <a href="#top">Back to top &uarr;</a>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
