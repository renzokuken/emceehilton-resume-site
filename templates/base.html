<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.SITE_TITLE }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ config.SITE_DESCRIPTION }}{% endblock %}">
  
  <!-- Open Graph / Social Meta -->
  <meta property="og:title" content="{% block og_title %}{{ config.SITE_TITLE }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ config.SITE_DESCRIPTION }}{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ config.SITE_URL }}{{ request.path }}">
  
  <!-- Feed -->
  <link rel="alternate" type="application/xml" title="{{ config.SITE_TITLE }} RSS Feed" href="{{ url_for('feed') }}">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/syntax.css') }}">
  
  <!-- Early theme check to avoid FOUC (Flash of Unstyled Content) -->
  <script>
    (function() {
      const stored = localStorage.getItem('user-theme-preference');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Header & Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="{{ url_for('index') }}" class="site-logo">
        <span class="dot"></span>
        <span>{{ config.AUTHOR_NAME }}</span>
      </a>

      <nav style="display: flex; align-items: center; gap: 1.5rem;">
        <ul class="nav-links">
          {% for item in config.NAV_ITEMS %}
          <li>
            <a href="{{ url_for(item.endpoint) }}" class="{% if request.endpoint == item.endpoint %}active{% endif %}">
              {{ item.title }}
            </a>
          </li>
          {% endfor %}
        </ul>

        <!-- Dark/Light Theme Toggle -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light and dark mode">
          <!-- Sun Icon (shown in dark mode) -->
          <svg id="sun-icon" style="display: none;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg id="moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-content">
      <div>
        &copy; {{ current_year }} {{ config.AUTHOR_NAME }}. Built with Flask &amp; Frozen-Flask.
      </div>
      <div class="footer-links">
        <a href="{{ url_for('feed') }}">RSS Feed</a>
        <a href="https://github.com/renzokuken" target="_blank" rel="noopener">GitHub</a>
        <a href="#top">Back to top &uarr;</a>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
